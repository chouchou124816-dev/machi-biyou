<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>マイページ</title>
</head>
<body>

<h2>マイページ</h2>
<p id="userEmail"></p>
<button id="logoutBtn">ログアウト</button>

<input id="shop-name" placeholder="店舗名">
<input id="shop-address" placeholder="住所">
<textarea id="shop-description" placeholder="説明"></textarea>

<button onclick="addShop()">店舗を登録する</button>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script>
const supabase = supabase.createClient(
  "https://kgijijgjnxppiqvlpqvq.supabase.co",
  "sb_publishable_ioB0JGLtDtJrH-WyAYluaw_654cHGwP"
);

async function loadUser() {
  const { data } = await supabase.auth.getUser();
  if (!data.user) {
    location.href = "login.html";
    return;
  }
  userEmail.textContent = "ログイン中: " + data.user.email;
}

logoutBtn.onclick = async () => {
  await supabase.auth.signOut();
  location.href = "login.html";
};

loadUser();
</script>

</body>
</html>
