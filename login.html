<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ログイン</title>
</head>
<body>

<h2>ログイン / 新規登録</h2>

<input id="email" type="email" placeholder="メールアドレス">
<input id="password" type="password" placeholder="パスワード">
<button id="loginBtn">ログイン</button>
<button id="signupBtn">新規登録</button>

<p id="msg"></p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script>
const sb = window.supabase.createClient(
  "https://kgijijgjnxppiqvlpqvq.supabase.co",
  "sb_publishable_ioB0JGLtDtJrH-WyAYluaw_654cHGwP"
);

document.getElementById("loginBtn").onclick = async () => {
  const emailValue = document.getElementById("email").value;
  const passwordValue = document.getElementById("password").value;

  const { error } = await sb.auth.signInWithPassword({
    email: emailValue,
    password: passwordValue
  });

  const msg = document.getElementById("msg");
  if (!error) location.href = "mypage.html";
};

document.getElementById("signupBtn").onclick = async () => {
  const emailValue = document.getElementById("email").value;
  const passwordValue = document.getElementById("password").value;

  const { error } = await sb.auth.signUp({
    email: emailValue,
    password: passwordValue
  });

  msg.textContent = error ? "登録失敗…" : "登録メールを送信しました！";
};
</script>

</body>
</html>
